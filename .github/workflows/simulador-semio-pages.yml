name: Deploy Simuladores UEM to GitHub Pages
# Mantiene Semio en la raíz y publica Neuro 1.9.1 en una subcarpeta.

on:
  push:
    branches: ["main"]
    paths:
      - "simulador-semio-mobile/**"
      - "neuro-1-9-1-mobile/**"
      - ".github/workflows/simulador-semio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp simulador-semio-mobile/index.html _site/index.html
          mkdir -p _site/simulador-semio-mobile
          cp -R simulador-semio-mobile/. _site/simulador-semio-mobile/
          mkdir -p _site/neuro-1-9-1-mobile
          cp -R neuro-1-9-1-mobile/. _site/neuro-1-9-1-mobile/

      - name: Upload simulators
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
